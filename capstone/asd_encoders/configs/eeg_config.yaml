dataset_root: "dataset/eeg+gait"
cache_dir: "cache/eeg"
tasks: ["walk", "dance"]

# eegData_<condition>.set inside each subject/task folder
condition: "all"

sfreq: 250          # target rate; recordings are resampled to it if they differ
win_sec: 4.0
overlap: 0.5

# The .set files are already EEGLAB-preprocessed, so only the steps their
# header says are missing get applied. Set force_filter to re-filter anyway.
force_filter: false
# 5*std amplitude clipping - null disables it (already-cleaned data rarely wants it)
clip_sd: null

model:
  n_channels: 16        
  conv_emb_dim: 40
  n_layers: 4
  n_heads: 8
  out_dim: 512
  dropout: 0.3

train:
  batch_size: 32
  epochs: 100
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  label_smoothing: 0.1
  early_stop_patience: 15
  n_folds: 5             
  seed: 42
  amp: true               
  num_workers: 8
  checkpoint_dir: "checkpoints/eeg"
